[project]
name = "repomap"
version = "0.1.0"
description = "Turn a repository into an interactive map of its code and infrastructure."
readme = "README.md"
authors = [
    { name = "Ahzaz Tahir", email = "ahzaztahir448@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
    "typer>=0.27.3",
]

[project.scripts]
repomap = "repomap.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
